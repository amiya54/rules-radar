name: Rules Radar

# 规范雷达：定期抓取船级社规范改版与 IMO 强制文件生效动态，产出静态报告并归档
# 双周报（对齐船舶低碳情报）：每周五 UTC 00:30 触发，偶数周（发布周）真正执行，
#   北京时间周五 08:30 出刊；间隔周的运行直接跳过，不消耗 Actions 分钟数。
#   周界沿用低碳的 epoch 周四界（WEEK_INDEX = epoch/604800），两个雷达同一天发刊。
# 手动触发：Actions 页面 "Run workflow"（手动触发无视门控，可用于补跑/验证）

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 5"

permissions:
  contents: write
  pages: write
  id-token: write

# Pages 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # 隔周门控：只有偶数周的周五才继续（与低碳情报 crawler.yml 同一套判据）
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check biweekly schedule
        id: check
        run: |
          WEEK_INDEX=$(( $(date -u +%s) / 604800 ))
          if [ $((WEEK_INDEX % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 本周为发布周，继续执行双周报"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭ 本周为间隔周，跳过本次运行"
          fi

  radar:
    needs: gate
    if: needs.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run radar
        run: python scripts/radar.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Commit report and ledger
        run: |
          git config user.name "rules-radar-bot"
          git config user.email "actions@localhost"
          # 同步远端（重跑/并发时远端可能已有新提交，避免 push 被拒）
          git pull --rebase --autostash origin main
          git add output/ data/
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "规范雷达报告 $(date -u +%F)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  # 部署独立成 job：artifact 只在 radar job 上传一次，deploy 失败（GitHub artifact API
  # 瞬时故障 / "Found 0 artifact"）时重跑 deploy job 即可——不会重复抓取、不会产生
  # 重复 artifact（2026-11-24 教训：单 job 重跑失败任务会堆出多个同名 artifact）。
  deploy:
    needs: radar
    if: always() && needs.radar.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # artifact API 有索引延迟，上传完立刻查会拿不到（Found 0 artifact）；等一会再部署
      - name: Wait for artifact indexing
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
