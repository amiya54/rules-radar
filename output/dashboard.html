<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>规范雷达 · 动态看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root { --bg:#FAF9F6; --ink:#16181A; --muted:#8A8781; --line:#E5E1D8; --amber:#C05621; --card:#FFF; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif; line-height:1.6; padding:40px 24px 60px; }
  .wrap { max-width:1040px; margin:0 auto; }
  h1 { font-family:Georgia,'Noto Serif SC','STSong',serif; font-size:30px; font-weight:700; }
  .kicker { font-size:12px; letter-spacing:4px; color:var(--amber); margin-bottom:10px; }
  .sub { color:var(--muted); font-size:14px; margin-top:8px; }
  .rule { height:1px; background:var(--line); margin:20px 0 0; }
  .stats { display:flex; gap:44px; padding:20px 2px; flex-wrap:wrap; }
  .stat b { font-family:Georgia,'Noto Serif SC',serif; font-size:26px; font-variant-numeric:tabular-nums; display:block; }
  .stat span { font-size:12px; color:var(--muted); letter-spacing:1px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; }
  @media (max-width:860px) { .grid { grid-template-columns:1fr; } h1 { font-size:24px; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:20px 20px 8px; }
  .card h2 { font-size:15px; font-weight:600; margin-bottom:4px; }
  .card p { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .chart { width:100%; height:360px; }
  .status { font-size:12px; color:var(--muted); margin-top:14px; }
  .status b { color:var(--amber); font-weight:600; }
  button { font-size:13px; color:var(--amber); background:none; border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; margin-top:12px; }
  button:hover { border-color:var(--amber); }
  button:disabled { opacity:.5; cursor:wait; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">规范雷达 · 台账</div>
  <h1>规范雷达 · 动态看板</h1>
  <div class="sub">数据每次打开时从 GitHub 实时拉取，图表为浏览器实时渲染，不是截图。</div>
  <div class="rule"></div>
  <div class="stats">
    <div class="stat"><b id="st-total">—</b><span>台账总条数</span></div>
    <div class="stat"><b id="st-eif">—</b><span>已定生效日期</span></div>
    <div class="stat"><b id="st-org">—</b><span>机构来源</span></div>
  </div>
  <div class="grid">
    <div class="card">
      <h2>每日新发现条目数</h2>
      <p>按首次收录日期统计；跨度超 8 周自动切换按周汇总</p>
      <div class="chart" id="c-day"></div>
    </div>
    <div class="card">
      <h2>机构来源分布</h2>
      <p>悬停扇区可展开，点击图例可筛选</p>
      <div class="chart" id="c-org"></div>
    </div>
  </div>
  <div class="status" id="status">正在加载数据…</div>
  <button id="reload">重新拉取最新数据</button>
  <p style="font-size:12px;color:var(--muted);margin-top:18px">数据来源：规范雷达台账 data/items.json（每小时抓取 + 双周报告自动更新）。返回报告页请用浏览器后退，或访问门户。</p>
</div>
<script>
const LEDGER_URLS = [
  'https://cdn.jsdelivr.net/gh/amiya54/rules-radar@main/data/items.json',
  'https://raw.githubusercontent.com/amiya54/rules-radar/main/data/items.json'
];
async function fetchData(){
  for (const url of LEDGER_URLS) {
    try {
      const r = await fetch(url, { cache:'no-store' });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch(e) {}
  }
  throw new Error('所有数据源均不可达');
}

const ORG_COLORS = ['#C05621','#0F6E56','#185FA5','#534AB7','#993556','#BA7517','#1D9E75','#378ADD'];
function setStatus(html){ document.getElementById('status').innerHTML = html; }

function weekStart(dstr){
  const d = new Date(dstr + 'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay()+6)%7));
  return isoLocal(d);
}
function isoLocal(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function renderDayChart(items, elId){
  const dayKeys = items
    .map(it => (it.first_seen || it.pub || '').slice(0,10))
    .filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s));
  let buckets = [];
  let useWeekly = false;
  if (dayKeys.length) {
    const ds = dayKeys.slice().sort();
    const spanDays = (new Date(ds[ds.length-1]) - new Date(ds[0])) / 86400000;
    useWeekly = spanDays > 56;
    const byBucket = {};
    dayKeys.forEach(k => {
      const b = useWeekly ? weekStart(k) : k;
      byBucket[b] = (byBucket[b]||0) + 1;
    });
    const filled = [];
    const cur = new Date(ds[0]+'T00:00:00'), end = new Date(ds[ds.length-1]+'T00:00:00');
    while (cur <= end) {
      const iso = isoLocal(cur);
      const b = useWeekly ? weekStart(iso) : iso;
      if (!filled.includes(b)) filled.push(b);
      cur.setDate(cur.getDate() + (useWeekly ? 7 : 1));
    }
    buckets = filled.map(b => [b, byBucket[b]||0]);
  }
  echarts.init(document.getElementById(elId)).setOption({
    animationDuration:1200, animationEasing:'cubicOut',
    grid:{ left:40, right:16, top:24, bottom:56 },
    tooltip:{ trigger:'axis' },
    xAxis:{ type:'category', data: buckets.map(b => useWeekly ? b[0].slice(5)+' 周' : b[0].slice(5)),
            axisLabel:{ fontSize:11, color:'#8A8781', rotate:45 } },
    yAxis:{ type:'value', minInterval:1, axisLabel:{ fontSize:11, color:'#8A8781' } },
    series:[{ type:'bar', data: buckets.map(b=>b[1]), barMaxWidth:26,
              itemStyle:{ color:'#C05621', borderRadius:[4,4,0,0] } }]
  });
}

function renderOrgChart(items, elId){
  const byOrg = {};
  items.forEach(it => {
    const o = it.org_cn || it.org || '其他';
    byOrg[o] = (byOrg[o]||0) + 1;
  });
  const orgData = Object.entries(byOrg).sort((a,b)=>b[1]-a[1]);
  echarts.init(document.getElementById(elId)).setOption({
    animationDuration:1400, animationEasing:'elasticOut',
    animationDelay: idx => idx*60,
    tooltip:{ trigger:'item', formatter:'{b}：{c} 条（{d}%）' },
    legend:{ bottom:0, textStyle:{ fontSize:11, color:'#8A8781' } },
    series:[{ type:'pie', radius:['42%','68%'], center:['50%','44%'],
      data: orgData.map(([name,value],i)=>({ name, value, itemStyle:{ color:ORG_COLORS[i%ORG_COLORS.length] } })),
      label:{ fontSize:11, color:'#2C2E30', formatter:'{b} {c}' },
      emphasis:{ scaleSize:8 } }]
  });
}

async function load(){
  const btn = document.getElementById('reload');
  btn.disabled = true;
  setStatus('正在拉取数据…');
  try {
    const data = await fetchData();
    const items = Object.values(data);
    document.getElementById('st-total').textContent = items.length;
    document.getElementById('st-eif').textContent = items.filter(it=>it.eif).length;
    document.getElementById('st-org').textContent = new Set(items.map(it=>it.org_cn||it.org)).size;
    renderDayChart(items, 'c-day');
    renderOrgChart(items, 'c-org');
    setStatus('加载成功：<b>'+items.length+'</b> 条 · '+new Date().toLocaleTimeString('zh-CN'));
  } catch(e) {
    setStatus('加载失败：'+e.message+'（已尝试多个数据源，请检查网络）');
  }
  btn.disabled = false;
}
document.getElementById('reload').addEventListener('click', load);
load();
</script>
</body>
</html>
